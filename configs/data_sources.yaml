# Data provider configuration
provider: nba_api

# Seasons to fetch
seasons:
  start: "2014-15"
  end: "2025-26"

# Rate limiting for API requests
rate_limit:
  requests_per_second: 1
  max_retries: 3
  backoff_factor: 2
  max_backoff_seconds: 60

# Raw response caching
cache:
  enabled: true
  format: parquet
  directory: data/raw/nba_api
