name: Publish Daily Forecast

on:
  schedule:
    # Morning ET publish for the first public slate.
    - cron: "5 15 * * *"
    # Evening ET refresh after more official injury reports have been submitted.
    - cron: "5 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show publish revision
        run: |
          echo "Publishing from commit $(git rev-parse --short HEAD)"
          git log -1 --oneline

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Publish forecast
        run: python -m src.app.publish_today --nextgen-shadow

      - name: Package context store bundle
        run: |
          mkdir -p artifacts
          if [ ! -d data/context_store ]; then
            echo "No context store directory found; skipping bundle."
            exit 0
          fi

          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          source = Path("data/context_store")
          output = Path("artifacts") / (
              f"context-store-{os.environ['GITHUB_RUN_ID']}-"
              f"{os.environ['GITHUB_RUN_ATTEMPT']}.zip"
          )

          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(source.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.as_posix())

          print(f"Wrote {output}")
          PY

      - name: Upload context store artifact
        uses: actions/upload-artifact@v4
        with:
          name: context-store-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/context-store-${{ github.run_id }}-${{ github.run_attempt }}.zip
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload context store to Google Drive
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_CONTEXT_FOLDER_ID: ${{ secrets.GDRIVE_CONTEXT_FOLDER_ID }}
        run: |
          if [ -z "$GDRIVE_SERVICE_ACCOUNT_JSON" ] || [ -z "$GDRIVE_CONTEXT_FOLDER_ID" ]; then
            echo "Google Drive secrets are not configured; skipping Drive upload."
            exit 0
          fi

          if [ -z "$(ls -A artifacts 2>/dev/null)" ]; then
            echo "No packaged context store artifacts found; skipping Drive upload."
            exit 0
          fi

          curl https://rclone.org/install.sh | sudo bash

          printf "%s" "$GDRIVE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/gdrive-service-account.json"
          cat > "$RUNNER_TEMP/rclone.conf" <<EOF
          [gdrive]
          type = drive
          scope = drive
          service_account_file = $RUNNER_TEMP/gdrive-service-account.json
          root_folder_id = $GDRIVE_CONTEXT_FOLDER_ID
          EOF

          RCLONE_CONFIG="$RUNNER_TEMP/rclone.conf" \
            rclone copy artifacts gdrive: --drive-chunk-size 64M --transfers 1 --checkers 4

      - name: Commit published artifacts
        run: |
          if [ -z "$(git status --porcelain published)" ]; then
            echo "No published changes to commit."
            exit 0
          fi

          TARGET_DATE=$(python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("published/manifest.json").read_text(encoding="utf-8"))
          print(manifest.get("target_date", "unknown"))
          PY
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published
          git commit -m "Publish forecast for ${TARGET_DATE}"
          git push origin main
