name: Publish Daily Forecast

on:
  schedule:
    - cron: "5 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Publish forecast
        run: python -m src.app.publish_today --nextgen-shadow

      - name: Commit published artifacts
        run: |
          if [ -z "$(git status --porcelain published)" ]; then
            echo "No published changes to commit."
            exit 0
          fi

          TARGET_DATE=$(python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("published/manifest.json").read_text(encoding="utf-8"))
          print(manifest.get("target_date", "unknown"))
          PY
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published
          git commit -m "Publish forecast for ${TARGET_DATE}"
          git push origin main
